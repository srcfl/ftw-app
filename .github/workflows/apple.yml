name: Apple

on:
  push:
    branches: [main]
    paths: ['appleApp/**', 'protocol/**', '.github/workflows/apple.yml']
  pull_request:
    paths: ['appleApp/**', 'protocol/**', '.github/workflows/apple.yml']

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apple:
    name: FTWKit and the iPhone app
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode on the runner
        run: |
          latest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$latest"
          xcodebuild -version
      - name: Test FTWKit, FTWShared and FTWDemo
        working-directory: appleApp/FTWKit
        run: swift test
      # Signed ad hoc, as FTW.xcconfig sets for the simulator, so the App
      # Group entitlement travels with the app and the widget. Device
      # builds need a team, which the project does not have yet.
      # The iPhone app embeds the Apple Watch app, so this builds the watch
      # app and its complications for the watchOS Simulator too.
      - name: Build the app, its widgets and the watch app for the simulators
        working-directory: appleApp
        run: >-
          xcodebuild build -quiet -project FTW.xcodeproj -scheme FTW
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/ios
      # For whoever reviews the screens: the demo, photographed in the
      # simulator. Evidence, not a gate, so a flaky simulator does not turn
      # the build red.
      - name: Photograph the demo in the iOS Simulator
        continue-on-error: true
        working-directory: appleApp
        run: scripts/demo-screenshots.sh build/screenshots
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-screenshots
          path: appleApp/build/screenshots
          if-no-files-found: ignore
